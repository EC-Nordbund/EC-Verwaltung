<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta
      name="description"
      content="Software für den EC-Nordbund die uns bei der Verwaltung hilft."
    />
    <meta name="theme-color" content="#8fb217" />
    <meta name="robots" content="noindex" />
    <title>EC-Nordbund Verwaltungs-App</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <noscript>
      <strong>Bitte Javascript aktivieren! Das geht sonst alles nicht...</strong>
    </noscript>

    <div id="app">
      <style>
        body {
          display: grid;
          grid-template-areas: '. . .' '. c .' '. . .';
          grid-template-rows: 1fr auto 1fr;
          grid-template-columns: 1fr auto 1fr;
          background-color: #eeeeee;
        }

        #app {
          grid-area: c;
        }

        html {
          display: grid;
          height: 100%;
        }
      </style>
      <iframe
        style="min-width: 500px; min-height: 295px; border: none"
        src="/loading.html"
      ></iframe>
    </div>
    <a id="ec-download" style="display: none"></a>
  </body>
</html>
