name: ci

on:
  workflow_dispatch:
  push:

concurrency:
  # keine parallelen Builds/Deploys für denselben Branch
  group: ci-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run types

      # Deploy analog zur EC-Website-CI (rsync über SSH-Deploy-Key),
      # aber nur vom main-Branch — es gibt genau einen Produktions-vhost.
      - name: Setup deploy
        if: github.ref_name == 'main'
        run: |
          echo "${{ secrets.DEPLOY_KEY }}" > deploy_key
          chmod 600 ./deploy_key

      - name: Deploy to verwaltung.ec-nordbund.de
        if: github.ref_name == 'main'
        run: |
          rsync -chrvz --stats --delete \
            -e 'ssh -i ./deploy_key -o StrictHostKeyChecking=no' \
            ./dist/ root@sk01.ec-nordbund.de:/ec/setup/data/vhosts/verwaltung.ec-nordbund.de/
